<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NutriAI - Smart Nutrition Assistant</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <header>

        <h1>🍎 NutriAI</h1>

        <p>
            AI Nutrition Assistant untuk rekomendasi makanan sehat
        </p>

    </header>



    <div class="card">


        <h2>👤 Data Kamu</h2>


        <div class="grid">


            <input 
            id="age"
            type="number"
            placeholder="Umur">


            <select id="gender">

                <option value="male">
                    Laki-laki
                </option>

                <option value="female">
                    Perempuan
                </option>

            </select>


            <input
            id="weight"
            type="number"
            placeholder="Berat (kg)">



            <input
            id="height"
            type="number"
            placeholder="Tinggi (cm)">



        </div>



        <h2>🎯 Tujuan Kesehatan</h2>


        <select id="goal">


            <option>
                Healthy Lifestyle
            </option>


            <option>
                Diet
            </option>


            <option>
                Muscle Gain
            </option>


            <option>
                Weight Loss
            </option>


        </select>




        <h2>🥗 Preferensi Makanan</h2>


        <input

        id="preference"

        placeholder="Contoh: high protein, rendah kalori">


        <button onclick="getRecommendation()">

            ✨ Dapatkan Rekomendasi

        </button>



    </div>




    <div class="card result">


        <h2>🍽️ Hasil Rekomendasi</h2>


        <div id="result">

            Belum ada rekomendasi

        </div>


    </div>



</div>



<script src="script.js"></script>


</body>

</html>
